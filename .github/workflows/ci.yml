name: ClaimMate AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install light test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run router tests
        run: |
          pytest tests/test_router.py
